data:
  name: mnist
  data_type: image
  data_path: data/mnist
  batch_size: 1
  vocab_size: 256
  # sample shape managed by custom dataset

network:
  _target_: src.nets.img.UNet
  vocab_size: ${data.vocab_size}
  in_channels: 1
  d_channels: 32
  n_layers: 2
  num_attn_heads: 1
  dropout_rate: 0.1
  time_scale: 1000.0

model:
  name: md4
  seq_len: null
  scheduler: cosine
  device: ${device}

train:
  num_iter: 100000
  resume_iter: null
  lr: 1e-4
  weight_decay: 0.0
  antithetic: true

logging:
  ckpt_dir: checkpoints/${data.name}_${model.name}
  log_freq: 500
  save_freq: 5000
  use_wandb: false
  project_name: mnist_diffusion
  run_name: md4_mnist_run


eval:
  num_samples: 16
  sample_steps: 100
  fid_every: ${logging.save_freq}
  fid_num_samples: 256
  fid_batch_size: 64
  fid_sample_steps: 100

device: cuda
seed: 42
