data:
  name: tinyshakespeare
  data_type: text
  data_path: data/input.txt
  batch_size: 1
  vocab_size: 65

network:
  _target_: src.nets.seq.SmallTransformer
  vocab_size: ${data.vocab_size}
  dim: 128
  n_layers: 4
  n_heads: 4
  mlp_ratio: 2 # hidden dim = mlp_ratio * dim
  dropout: 0.1
  max_seq_len: ${model.seq_len}
  time_scale: 1000.0

model:
  name: md4
  seq_len: 768
  scheduler: cosine

train:
  num_iter: 100000
  lr: 1e-4
  grad_clip: 1.0
  weight_decay: 0.0
  antithetic: true

logging:
  ckpt_dir: checkpoints/$data.name_$model.name
  log_freq: 500
  save_freq: 5000
  use_wandb: false

device: cuda
seed: 42
